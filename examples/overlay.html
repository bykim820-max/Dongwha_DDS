<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>DDS · 오버레이 데모</title>
<link rel="stylesheet" href="../dist/tokens.css" />
<link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/static/pretendard.css" />
<style>
  *{box-sizing:border-box;}
  body{margin:0;font-family:var(--font-body),system-ui,sans-serif;font-size:var(--body-md-font-size);line-height:1.5;
    font-weight:var(--font-weight-regular);letter-spacing:.2px;color:var(--color-text-primary);background:var(--color-bg-secondary);padding:var(--space-32);}
  body.lock{overflow:hidden;}
  main{max-width:760px;margin:0 auto;display:flex;flex-direction:column;gap:var(--space-24);}
  h1{font-family:var(--font-heading);font-size:24px;font-weight:var(--font-weight-semibold);margin:0;}
  h2{font-family:var(--font-heading);font-size:var(--heading-sm-font-size);line-height:var(--heading-sm-line-height);font-weight:var(--font-weight-semibold);margin:0;}
  .caption{font-size:var(--body-sm-font-size);color:var(--color-text-tertiary);}
  .ic{width:18px;height:18px;stroke:currentColor;stroke-width:1.6;fill:none;stroke-linecap:round;stroke-linejoin:round;flex:none;}
  .card{background:var(--color-bg-primary);border-radius:var(--radius-xl);padding:var(--space-24);box-shadow:var(--shadow-md);display:flex;flex-direction:column;gap:var(--space-16);}
  .row{display:flex;flex-wrap:wrap;gap:var(--space-12);align-items:center;}
  .btn{display:inline-flex;align-items:center;gap:var(--space-6);height:40px;padding:0 var(--space-16);font-family:var(--font-body);font-size:var(--body-md-font-size);font-weight:var(--font-weight-medium);
    border:var(--border-width-sm) solid var(--color-border-secondary);border-radius:var(--radius-md);background:var(--color-bg-primary);color:var(--color-text-primary);cursor:pointer;transition:transform 80ms var(--motion-easing-standard),background-color 80ms var(--motion-easing-standard);}
  .btn:active{transform:scale(0.97);}
  .btn:focus-visible{outline:2px solid var(--color-border-info);outline-offset:2px;}
  .btn--primary{background:var(--color-bg-interactive-primary);color:#fff;border-color:transparent;}
  .btn--primary:hover{background:var(--color-bg-interactive-primary-hover);}
  .btn .ic{width:16px;height:16px;}
  .iconbtn{display:inline-grid;place-items:center;width:32px;height:32px;border-radius:var(--radius-md);border:0;background:transparent;color:var(--color-text-tertiary);cursor:pointer;}
  .iconbtn:hover{background:var(--color-bg-interactive-secondary-hover);}

  /* Scrim */
  .scrim{position:fixed;inset:0;background:rgba(0,0,0,0.45);opacity:0;pointer-events:none;transition:opacity var(--motion-duration-quick) var(--motion-easing-standard);z-index:40;}
  .scrim.open{opacity:1;pointer-events:auto;}

  /* Modal */
  .modal{position:fixed;left:50%;top:50%;z-index:50;width:min(560px,calc(100vw - var(--space-32)));
    background:var(--color-bg-primary);border-radius:var(--radius-2xl);box-shadow:var(--elevation-modal);
    transform:translate(-50%,calc(-50% + 12px));opacity:0;pointer-events:none;
    transition:opacity var(--motion-duration-base) var(--motion-easing-standard),transform var(--motion-duration-moderate) var(--motion-easing-spring-soft);}
  .modal.open{opacity:1;pointer-events:auto;transform:translate(-50%,-50%);}
  .modal-h{display:flex;align-items:center;justify-content:space-between;padding:var(--space-20) var(--space-24);border-bottom:var(--border-width-sm) solid var(--color-border-secondary);}
  .modal-b{padding:var(--space-24);color:var(--color-text-secondary);}
  .modal-f{display:flex;justify-content:flex-end;gap:var(--space-8);padding:var(--space-16) var(--space-24);border-top:var(--border-width-sm) solid var(--color-border-secondary);}

  /* Bottom Sheet */
  .sheet{position:fixed;left:0;right:0;bottom:0;z-index:50;background:var(--color-bg-primary);
    border-radius:var(--radius-2xl) var(--radius-2xl) 0 0;box-shadow:var(--elevation-modal);
    transform:translateY(100%);transition:transform var(--motion-duration-moderate) var(--motion-easing-spring-soft);padding-bottom:var(--space-16);}
  .sheet.open{transform:translateY(0);}
  .grabber{width:36px;height:4px;border-radius:var(--radius-rounded);background:var(--color-bg-tertiary);margin:var(--space-8) auto var(--space-4);}
  .sheet h2{padding:var(--space-12) var(--space-24);}
  .opt{display:flex;align-items:center;gap:var(--space-12);padding:var(--space-16) var(--space-24);cursor:pointer;}
  .opt:hover{background:var(--color-bg-secondary);}

  /* Drawer (right) */
  .drawer{position:fixed;top:0;right:0;height:100vh;width:min(400px,90vw);z-index:50;background:var(--color-bg-primary);
    box-shadow:var(--elevation-modal);transform:translateX(100%);transition:transform var(--motion-duration-moderate) var(--motion-easing-spring-soft);
    display:flex;flex-direction:column;}
  .drawer.open{transform:translateX(0);}
  .drawer-h{display:flex;align-items:center;justify-content:space-between;padding:var(--space-20) var(--space-24);border-bottom:var(--border-width-sm) solid var(--color-border-secondary);}
  .drawer-b{padding:var(--space-24);display:flex;flex-direction:column;gap:var(--space-16);overflow:auto;}
  .field{display:flex;flex-direction:column;gap:var(--space-6);}
  .field label{font-size:var(--body-sm-font-size);color:var(--color-text-secondary);}
  .input{height:40px;padding:0 var(--space-12);border:var(--border-width-sm) solid var(--color-border-secondary);border-radius:var(--radius-md);background:var(--color-bg-primary);}

  /* Dropdown Menu (anchored) */
  .menuwrap{position:relative;display:inline-flex;}
  .menu{position:absolute;top:calc(100% + var(--space-8));right:0;min-width:200px;z-index:30;
    background:var(--color-bg-primary);border:var(--border-width-sm) solid var(--color-border-secondary);border-radius:var(--radius-lg);box-shadow:var(--elevation-overlay);
    padding:var(--space-6);opacity:0;transform:translateY(4px);pointer-events:none;transition:opacity var(--motion-duration-base) var(--motion-easing-standard),transform var(--motion-duration-base) var(--motion-easing-standard);}
  .menu.open{opacity:1;transform:translateY(0);pointer-events:auto;}
  .mitem{display:flex;align-items:center;gap:var(--space-12);width:100%;padding:var(--space-8) var(--space-12);border:0;background:transparent;border-radius:var(--radius-md);font:inherit;color:var(--color-text-primary);cursor:pointer;text-align:left;}
  .mitem:hover{background:var(--color-bg-interactive-secondary-hover);}
  .mitem.danger{color:var(--color-text-danger);}
  .mdiv{height:1px;background:var(--color-border-secondary);margin:var(--space-6) 0;}

  @media (prefers-reduced-motion:reduce){*,*::before,*::after{transition-duration:.01ms !important;}}
</style>
</head>
<body>
<svg width="0" height="0" style="position:absolute" aria-hidden="true">
  <symbol id="i-x" viewBox="0 0 24 24"><path d="M6 6l12 12M18 6 6 18"/></symbol>
  <symbol id="i-filter" viewBox="0 0 24 24"><path d="M4 5h16M7 12h10M10 19h4"/></symbol>
  <symbol id="i-more" viewBox="0 0 24 24"><circle cx="5" cy="12" r="1.2"/><circle cx="12" cy="12" r="1.2"/><circle cx="19" cy="12" r="1.2"/></symbol>
  <symbol id="i-edit" viewBox="0 0 24 24"><path d="M12 20h9"/><path d="M16.5 3.5a2.1 2.1 0 0 1 3 3L7 19l-4 1 1-4z"/></symbol>
  <symbol id="i-copy" viewBox="0 0 24 24"><rect x="9" y="9" width="11" height="11" rx="2"/><path d="M5 15V5a2 2 0 0 1 2-2h10"/></symbol>
  <symbol id="i-trash" viewBox="0 0 24 24"><path d="M3 6h18M8 6V4h8v2M6 6l1 14h10l1-14"/></symbol>
  <symbol id="i-doc" viewBox="0 0 24 24"><path d="M14 3H7a2 2 0 0 0-2 2v14a2 2 0 0 0 2 2h10a2 2 0 0 0 2-2V8z"/><path d="M14 3v5h5"/></symbol>
  <symbol id="i-share" viewBox="0 0 24 24"><circle cx="18" cy="5" r="3"/><circle cx="6" cy="12" r="3"/><circle cx="18" cy="19" r="3"/><path d="M8.6 13.5l6.8 4M15.4 6.5l-6.8 4"/></symbol>
</svg>

<main>
  <div><h1>오버레이 컴포넌트</h1><span class="caption">Modal · Bottom Sheet · Drawer · Dropdown Menu · ESC·스크림 클릭으로 닫힘, 포커스 복귀</span></div>

  <section class="card">
    <h2>열어보기</h2>
    <div class="row">
      <button class="btn btn--primary" onclick="openOv('modal')">Modal 열기</button>
      <button class="btn" onclick="openOv('sheet')">Bottom Sheet</button>
      <button class="btn" onclick="openOv('drawer')"><svg class="ic"><use href="#i-filter"/></svg>필터 (Drawer)</button>
      <span class="menuwrap">
        <button class="btn" id="menuBtn" aria-haspopup="true" aria-expanded="false" onclick="toggleMenu(event)"><svg class="ic"><use href="#i-more"/></svg>메뉴</button>
        <div class="menu" id="menu" role="menu">
          <button class="mitem" role="menuitem"><svg class="ic"><use href="#i-edit"/></svg>수정</button>
          <button class="mitem" role="menuitem"><svg class="ic"><use href="#i-copy"/></svg>복제</button>
          <button class="mitem" role="menuitem"><svg class="ic"><use href="#i-share"/></svg>공유</button>
          <div class="mdiv"></div>
          <button class="mitem danger" role="menuitem"><svg class="ic"><use href="#i-trash"/></svg>삭제</button>
        </div>
      </span>
    </div>
    <span class="caption">데스크톱=Modal/Popover, 모바일=Bottom Sheet 로 형식을 분기하세요.</span>
  </section>
</main>

<!-- Scrim (모달형 공용) -->
<div class="scrim" id="scrim" onclick="closeOv()"></div>

<!-- Modal -->
<div class="modal" id="modal" role="dialog" aria-modal="true" aria-labelledby="modalTitle">
  <div class="modal-h"><h2 id="modalTitle">주문 삭제</h2><button class="iconbtn" aria-label="닫기" onclick="closeOv()"><svg class="ic"><use href="#i-x"/></svg></button></div>
  <div class="modal-b">주문 <b>#10293</b> 을(를) 삭제할까요? 이 작업은 되돌릴 수 없습니다.</div>
  <div class="modal-f"><button class="btn" onclick="closeOv()">취소</button><button class="btn btn--primary" onclick="closeOv()">삭제</button></div>
</div>

<!-- Bottom Sheet -->
<div class="sheet" id="sheet" role="dialog" aria-modal="true" aria-labelledby="sheetTitle">
  <div class="grabber"></div>
  <h2 id="sheetTitle">정렬 기준</h2>
  <div class="opt" onclick="closeOv()"><svg class="ic"><use href="#i-doc"/></svg>최신순</div>
  <div class="opt" onclick="closeOv()"><svg class="ic"><use href="#i-doc"/></svg>금액 높은순</div>
  <div class="opt" onclick="closeOv()"><svg class="ic"><use href="#i-doc"/></svg>상태별</div>
</div>

<!-- Drawer -->
<div class="drawer" id="drawer" role="dialog" aria-modal="true" aria-labelledby="drawerTitle">
  <div class="drawer-h"><h2 id="drawerTitle">필터</h2><button class="iconbtn" aria-label="닫기" onclick="closeOv()"><svg class="ic"><use href="#i-x"/></svg></button></div>
  <div class="drawer-b">
    <div class="field"><label>채널</label><input class="input" placeholder="전체" /></div>
    <div class="field"><label>담당자</label><input class="input" placeholder="전체" /></div>
    <div class="field"><label>기간</label><input class="input" placeholder="이번 달" /></div>
    <button class="btn btn--primary" onclick="closeOv()">적용</button>
  </div>
</div>

<script>
  var current=null, trigger=null;
  function openOv(id){
    trigger=document.activeElement;
    current=document.getElementById(id);
    document.getElementById('scrim').classList.add('open');
    current.classList.add('open');
    document.body.classList.add('lock');
    var f=current.querySelector('button,input,[tabindex]'); if(f) f.focus();
  }
  function closeOv(){
    if(!current) return;
    document.getElementById('scrim').classList.remove('open');
    current.classList.remove('open');
    document.body.classList.remove('lock');
    current=null;
    if(trigger&&trigger.focus) trigger.focus();
  }
  // Dropdown menu (비모달)
  function toggleMenu(e){
    e.stopPropagation();
    var m=document.getElementById('menu'), b=document.getElementById('menuBtn');
    var open=m.classList.toggle('open');
    b.setAttribute('aria-expanded',String(open));
  }
  document.addEventListener('click',function(){var m=document.getElementById('menu');if(m.classList.contains('open')){m.classList.remove('open');document.getElementById('menuBtn').setAttribute('aria-expanded','false');}});
  document.addEventListener('keydown',function(e){if(e.key==='Escape'){closeOv();var m=document.getElementById('menu');m.classList.remove('open');document.getElementById('menuBtn').setAttribute('aria-expanded','false');}});
</script>
</body>
</html>
