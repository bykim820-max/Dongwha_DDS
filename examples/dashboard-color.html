<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>DDS · 컬러 대시보드 (라인 아이콘)</title>
<link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/static/pretendard.css" />
<style>
  /* ── DDS v2.0 토큰 + 확장(accent·subtle·chart) 내장본 ──
     규칙: 이모지 아이콘 금지(라인 SVG만) · 그라데이션 띠 금지 · 일반 밀도 · 컬러는 다채롭되 조화 */
  :root{
    --color-text-primary:#171717; --color-text-secondary:#404040; --color-text-tertiary:#737373;
    --color-text-success:#0c8048; --color-text-danger:#a71010;
    --color-bg-primary:#fff; --color-bg-secondary:#fafafa; --color-bg-tertiary:#f5f5f5; --color-bg-inverse:#262626;
    --color-bg-interactive-primary:#14bc62; --color-bg-interactive-primary-hover:#0c8048;
    --color-bg-interactive-secondary-hover:#e5e5e5;
    --color-border-secondary:#e5e5e5; --color-border-info:#196ce8;
    --color-bg-success-subtle:#e9f9ef; --color-bg-info-subtle:#eff6ff; --color-bg-warning-subtle:#fff9e6; --color-bg-danger-subtle:#ffecec;
    --color-accent-violet-subtle:#f6e8ff; --color-accent-violet:#9c19e8; --color-accent-violet-bold:#68119c;
    --color-accent-pink-subtle:#ffeaf0;   --color-accent-pink:#fa2a6f;   --color-accent-pink-bold:#b11851;
    --color-accent-orange-subtle:#fff3e8; --color-accent-orange:#ff8539; --color-accent-orange-bold:#b55723;
    --color-accent-cyan-subtle:#e5fafc;   --color-accent-cyan:#00b0b9;   --color-accent-cyan-bold:#007a82;
    --color-accent-amber-subtle:#fff9e6;  --color-accent-amber:#facc15;  --color-accent-amber-bold:#b3890b;
    --color-chart-1:#14bc62; --color-chart-2:#196ce8; --color-chart-3:#9c19e8; --color-chart-4:#ff8539;
    --color-chart-5:#00b0b9; --color-chart-6:#fa2a6f;
    --space-2:2px; --space-4:4px; --space-6:6px; --space-8:8px; --space-10:10px; --space-12:12px; --space-16:16px; --space-20:20px; --space-24:24px; --space-32:32px;
    --radius-sm:2px; --radius-md:4px; --radius-lg:8px; --radius-xl:12px; --radius-rounded:999999px;
    --border-width-sm:1px; --border-width-md:2px;
    --font-heading:Pretendard; --font-body:Pretendard;
    --heading-md-font-size:24px; --heading-md-line-height:30px; --heading-sm-font-size:20px; --heading-sm-line-height:24px;
    --heading-md-font-weight:600; --heading-sm-font-weight:600;
    --body-md-font-size:14px; --body-sm-font-size:12px;
    /* 굵기 축 (typography.md §3.1) — body 기본 400 */
    --body-md-font-weight:400;
    --font-weight-regular:400; --font-weight-medium:500; --font-weight-semibold:600; --font-weight-bold:700;
    --motion-duration-instant:80ms; --motion-duration-base:240ms;
    --motion-easing-standard:cubic-bezier(0.4,0,0.2,1); --motion-easing-spring-soft:cubic-bezier(0.32,0.72,0,1);
    --shadow-sm:0 1px 2px #00000029,0 0 1px #0000001f; --shadow-md:0 2px 4px #00000029,0 0 4px #0000001f;
  }
  *{box-sizing:border-box;}
  body{margin:0;font-family:var(--font-body),system-ui,sans-serif;font-size:var(--body-md-font-size);line-height:1.5;
    font-weight:var(--body-md-font-weight);letter-spacing:.2px;color:var(--color-text-primary);background:var(--color-bg-secondary);}
  h1,h2{font-family:var(--font-heading);letter-spacing:-0.2px;margin:0;}
  .caption{font-size:var(--body-sm-font-size);color:var(--color-text-tertiary);}
  /* 라인 아이콘: 모두 stroke=currentColor, fill 없음 */
  .ic{width:18px;height:18px;stroke:currentColor;stroke-width:1.5;fill:none;stroke-linecap:round;stroke-linejoin:round;flex:none;}

  .topbar{display:flex;align-items:center;justify-content:space-between;gap:var(--space-16);
    padding:var(--space-12) var(--space-24);background:var(--color-bg-primary);
    border-bottom:var(--border-width-sm) solid var(--color-border-secondary);position:sticky;top:0;z-index:5;}
  .brand{display:flex;align-items:center;gap:var(--space-8);}
  .brand .mark{width:26px;height:26px;border-radius:var(--radius-md);background:var(--color-bg-interactive-primary);
    color:#fff;display:grid;place-items:center;font-weight:var(--font-weight-bold);font-size:13px;}
  .right{display:flex;align-items:center;gap:var(--space-8);}
  .search{display:flex;align-items:center;gap:var(--space-8);height:36px;padding:0 var(--space-12);
    border:var(--border-width-sm) solid var(--color-border-secondary);border-radius:var(--radius-md);
    background:var(--color-bg-secondary);color:var(--color-text-tertiary);width:200px;}
  .search input{border:0;background:transparent;outline:none;font-size:var(--body-md-font-size);color:var(--color-text-primary);width:100%;}
  .btn{display:inline-flex;align-items:center;gap:var(--space-6);height:36px;padding:0 var(--space-12);
    font-family:var(--font-body);font-size:var(--body-md-font-size);border:var(--border-width-sm) solid var(--color-border-secondary);
    border-radius:var(--radius-md);background:var(--color-bg-primary);color:var(--color-text-primary);cursor:pointer;font-weight:var(--font-weight-medium);
    transition:transform var(--motion-duration-instant) var(--motion-easing-standard),background-color var(--motion-duration-instant) var(--motion-easing-standard);}
  .btn:active{transform:scale(0.97);}
  .btn--primary{background:var(--color-bg-interactive-primary);color:#fff;border-color:transparent;}
  .btn--primary:hover{background:var(--color-bg-interactive-primary-hover);}
  .btn .ic{width:16px;height:16px;}

  main{padding:var(--space-24);display:flex;flex-direction:column;gap:var(--space-24);max-width:1200px;margin:0 auto;}
  .pagehead{display:flex;align-items:flex-end;justify-content:space-between;gap:var(--space-16);}
  .pagehead h1{font-size:var(--heading-md-font-size);line-height:var(--heading-md-line-height);font-weight:var(--heading-md-font-weight);}

  /* KPI 6열 — 일반 밀도, 컬러는 accent-subtle 칩으로만 절제 사용 */
  .kpis{display:grid;grid-template-columns:repeat(3,1fr);gap:var(--space-16);}
  @media(min-width:1000px){.kpis{grid-template-columns:repeat(6,1fr);}}
  .kpi{background:var(--color-bg-primary);border:var(--border-width-sm) solid var(--color-border-secondary);border-radius:var(--radius-lg);
    padding:var(--space-20);display:flex;flex-direction:column;gap:var(--space-8);box-shadow:var(--shadow-sm);}
  .kpi .chip{width:34px;height:34px;border-radius:var(--radius-md);display:grid;place-items:center;}
  .kpi .chip .ic{width:18px;height:18px;}
  .kpi .label{color:var(--color-text-tertiary);font-size:var(--body-sm-font-size);}
  .kpi .value{font-family:var(--font-heading);font-size:22px;font-weight:var(--font-weight-semibold);letter-spacing:-.5px;}
  .kpi .delta{font-size:var(--body-sm-font-size);font-weight:var(--font-weight-medium);}
  .up{color:var(--color-text-success);} .down{color:var(--color-text-danger);}
  .c-green{background:var(--color-bg-success-subtle);color:var(--color-text-success);}
  .c-cyan{background:var(--color-accent-cyan-subtle);color:var(--color-accent-cyan-bold);}
  .c-violet{background:var(--color-accent-violet-subtle);color:var(--color-accent-violet-bold);}
  .c-orange{background:var(--color-accent-orange-subtle);color:var(--color-accent-orange-bold);}
  .c-amber{background:var(--color-accent-amber-subtle);color:var(--color-accent-amber-bold);}
  .c-pink{background:var(--color-accent-pink-subtle);color:var(--color-accent-pink-bold);}

  .grid{display:grid;grid-template-columns:1.7fr 1fr;gap:var(--space-16);}
  @media(max-width:1000px){.grid{grid-template-columns:1fr;}}
  .card{background:var(--color-bg-primary);border:var(--border-width-sm) solid var(--color-border-secondary);border-radius:var(--radius-lg);
    padding:var(--space-24);display:flex;flex-direction:column;gap:var(--space-16);box-shadow:var(--shadow-sm);}
  .card .head{display:flex;align-items:center;justify-content:space-between;gap:var(--space-12);}
  .h-sm{font-size:var(--heading-sm-font-size);line-height:var(--heading-sm-line-height);font-weight:var(--heading-sm-font-weight);}
  .legend{display:flex;gap:var(--space-12);flex-wrap:wrap;}
  .legend span{display:inline-flex;align-items:center;gap:var(--space-6);font-size:var(--body-sm-font-size);color:var(--color-text-secondary);}
  .dot{width:10px;height:10px;border-radius:var(--radius-rounded);}

  .bars{display:flex;align-items:flex-end;gap:var(--space-16);height:180px;}
  .bcol{flex:1;display:flex;flex-direction:column;align-items:center;gap:var(--space-8);height:100%;justify-content:flex-end;}
  .group{display:flex;align-items:flex-end;gap:4px;width:100%;justify-content:center;height:100%;}
  .b{width:10px;border-radius:var(--radius-sm) var(--radius-sm) 0 0;transition:height var(--motion-duration-base) var(--motion-easing-spring-soft);}
  .bcol .xl{font-size:var(--body-sm-font-size);color:var(--color-text-tertiary);}

  .tags{display:flex;flex-direction:column;gap:var(--space-10);}
  .tagrow{display:flex;align-items:center;justify-content:space-between;gap:var(--space-8);}
  .tag{display:inline-flex;align-items:center;padding:var(--space-2) var(--space-8);border-radius:var(--radius-rounded);font-size:var(--body-sm-font-size);}
  .barmini{height:6px;border-radius:var(--radius-rounded);}

  table{width:100%;border-collapse:collapse;font-size:var(--body-md-font-size);}
  thead th{text-align:left;padding:var(--space-12);color:var(--color-text-tertiary);font-weight:var(--font-weight-medium);
    border-bottom:var(--border-width-md) solid var(--color-border-secondary);white-space:nowrap;}
  tbody td{padding:var(--space-12);border-bottom:var(--border-width-sm) solid var(--color-border-secondary);white-space:nowrap;}
  tbody tr{transition:background-color var(--motion-duration-instant) var(--motion-easing-standard);}
  tbody tr:hover{background:var(--color-bg-secondary);}
  .nameC{display:inline-flex;align-items:center;gap:var(--space-8);}
  .ava{width:24px;height:24px;border-radius:var(--radius-rounded);display:inline-grid;place-items:center;font-size:11px;color:#fff;}
  .badge{display:inline-flex;padding:var(--space-2) var(--space-8);border-radius:var(--radius-rounded);font-size:var(--body-sm-font-size);}
  .b-s{background:var(--color-bg-success-subtle);color:var(--color-text-success);}
  .b-w{background:var(--color-bg-warning-subtle);color:var(--color-accent-amber-bold);}
  .b-d{background:var(--color-bg-danger-subtle);color:var(--color-text-danger);}
  .b-i{background:var(--color-bg-info-subtle);color:#0f4aa8;}
  .b-v{background:var(--color-accent-violet-subtle);color:var(--color-accent-violet-bold);}

  @media (prefers-reduced-motion:reduce){*,*::before,*::after{transition-duration:.01ms !important;}}
</style>
</head>
<body>

<!-- 라인 아이콘 스프라이트 (stroke=currentColor, 이모지 미사용) -->
<svg width="0" height="0" style="position:absolute" aria-hidden="true">
  <symbol id="i-card" viewBox="0 0 24 24"><rect x="2" y="5" width="20" height="14" rx="2"/><path d="M2 10h20"/></symbol>
  <symbol id="i-cart" viewBox="0 0 24 24"><circle cx="9" cy="20" r="1"/><circle cx="18" cy="20" r="1"/><path d="M2 3h2l2.4 12.4a2 2 0 0 0 2 1.6h8.7a2 2 0 0 0 2-1.6L21 7H5"/></symbol>
  <symbol id="i-user" viewBox="0 0 24 24"><path d="M19 21v-2a4 4 0 0 0-4-4H9a4 4 0 0 0-4 4v2"/><circle cx="12" cy="7" r="4"/></symbol>
  <symbol id="i-box" viewBox="0 0 24 24"><path d="M21 16V8a2 2 0 0 0-1-1.7l-7-4a2 2 0 0 0-2 0l-7 4A2 2 0 0 0 3 8v8a2 2 0 0 0 1 1.7l7 4a2 2 0 0 0 2 0l7-4A2 2 0 0 0 21 16z"/><path d="M3.3 7 12 12l8.7-5"/><path d="M12 22V12"/></symbol>
  <symbol id="i-clock" viewBox="0 0 24 24"><circle cx="12" cy="12" r="9"/><path d="M12 7v5l3 2"/></symbol>
  <symbol id="i-return" viewBox="0 0 24 24"><path d="M3 7v6h6"/><path d="M3.5 13a9 9 0 1 0 2-9.5L3 7"/></symbol>
  <symbol id="i-search" viewBox="0 0 24 24"><circle cx="11" cy="11" r="7"/><path d="M21 21l-4.3-4.3"/></symbol>
  <symbol id="i-plus" viewBox="0 0 24 24"><path d="M12 5v14M5 12h14"/></symbol>
</svg>

<header class="topbar">
  <div class="brand"><span class="mark">D</span><b>동화 DDS</b><span class="caption">· 영업 대시보드</span></div>
  <div class="right">
    <span class="search"><svg class="ic"><use href="#i-search"/></svg><input placeholder="검색" /></span>
    <button class="btn btn--primary"><svg class="ic"><use href="#i-plus"/></svg>새 주문</button>
  </div>
</header>

<main>
  <div class="pagehead">
    <div><h1>대시보드</h1><span class="caption">2026년 6월 19일 · 실시간 현황</span></div>
    <button class="btn">리포트 내보내기</button>
  </div>

  <!-- KPI: 라인 아이콘 + accent-subtle 칩 -->
  <section class="kpis">
    <div class="kpi"><span class="chip c-green"><svg class="ic"><use href="#i-card"/></svg></span><span class="label">총 매출</span><span class="value">48.2M</span><span class="delta up">+12.4%</span></div>
    <div class="kpi"><span class="chip c-cyan"><svg class="ic"><use href="#i-cart"/></svg></span><span class="label">주문</span><span class="value">1,284</span><span class="delta up">+6.1%</span></div>
    <div class="kpi"><span class="chip c-violet"><svg class="ic"><use href="#i-user"/></svg></span><span class="label">신규 고객</span><span class="value">312</span><span class="delta down">−2.3%</span></div>
    <div class="kpi"><span class="chip c-orange"><svg class="ic"><use href="#i-box"/></svg></span><span class="label">출고</span><span class="value">1,102</span><span class="delta up">+4.8%</span></div>
    <div class="kpi"><span class="chip c-amber"><svg class="ic"><use href="#i-clock"/></svg></span><span class="label">평균 처리</span><span class="value">2.4h</span><span class="delta up">−0.3h</span></div>
    <div class="kpi"><span class="chip c-pink"><svg class="ic"><use href="#i-return"/></svg></span><span class="label">반품률</span><span class="value">1.2%</span><span class="delta up">−0.4%</span></div>
  </section>

  <section class="grid">
    <div class="card">
      <div class="head"><h2 class="h-sm">채널별 주간 매출</h2>
        <div class="legend">
          <span><span class="dot" style="background:var(--color-chart-1)"></span>온라인</span>
          <span><span class="dot" style="background:var(--color-chart-2)"></span>대리점</span>
          <span><span class="dot" style="background:var(--color-chart-3)"></span>직영</span>
        </div>
      </div>
      <div class="bars" id="bars"></div>
    </div>

    <div class="card">
      <h2 class="h-sm">제품 카테고리</h2>
      <div class="tags">
        <div class="tagrow"><span class="tag c-green">합판/보드</span><b>38%</b></div>
        <div class="barmini" style="width:38%;background:var(--color-chart-1)"></div>
        <div class="tagrow"><span class="tag c-cyan">바닥재</span><b>24%</b></div>
        <div class="barmini" style="width:24%;background:var(--color-chart-5)"></div>
        <div class="tagrow"><span class="tag c-violet">벽지/인테리어</span><b>18%</b></div>
        <div class="barmini" style="width:18%;background:var(--color-chart-3)"></div>
        <div class="tagrow"><span class="tag c-orange">몰딩/마감재</span><b>12%</b></div>
        <div class="barmini" style="width:12%;background:var(--color-chart-4)"></div>
        <div class="tagrow"><span class="tag c-pink">기타</span><b>8%</b></div>
        <div class="barmini" style="width:8%;background:var(--color-chart-6)"></div>
      </div>
    </div>
  </section>

  <section class="card">
    <div class="head"><h2 class="h-sm">최근 주문</h2><button class="btn">전체 보기</button></div>
    <table>
      <thead><tr><th>주문</th><th>고객</th><th>상품</th><th>채널</th><th>담당</th><th>금액</th><th>상태</th></tr></thead>
      <tbody id="rows"></tbody>
    </table>
  </section>
</main>

<script>
  var weeks=[['월',60,40,30],['화',72,55,38],['수',50,44,28],['목',88,60,40],['금',100,70,52],['토',34,28,20],['일',26,22,16]];
  var cc=['var(--color-chart-1)','var(--color-chart-2)','var(--color-chart-3)'];
  document.getElementById('bars').innerHTML = weeks.map(function(w){
    var g=[w[1],w[2],w[3]].map(function(h,i){return '<span class="b" style="height:'+h+'%;background:'+cc[i]+'"></span>';}).join('');
    return '<div class="bcol"><div class="group">'+g+'</div><span class="xl">'+w[0]+'</span></div>';
  }).join('');

  var avc=['var(--color-chart-3)','var(--color-chart-5)','var(--color-chart-4)','var(--color-chart-2)','var(--color-chart-6)','var(--color-chart-1)'];
  var data=[
    ['#10293','김보영','합판 A2 · 외 2건','온라인','이수','1,240,000','b-s','완료'],
    ['#10294','이서준','MDF 9T','대리점','박민','320,000','b-w','대기'],
    ['#10295','박지민','강마루 · 시공','직영','최유','880,000','b-d','실패'],
    ['#10296','최유나','벽지 프리미엄','온라인','이수','156,000','b-s','완료'],
    ['#10297','정도현','몰딩 세트','대리점','한결','92,000','b-i','배송중'],
    ['#10298','오세훈','강화마루','직영','박민','540,000','b-v','검토'],
    ['#10299','윤하늘','합판 B1','온라인','한결','276,000','b-s','완료']
  ];
  document.getElementById('rows').innerHTML = data.map(function(r,i){
    return '<tr><td><b>'+r[0]+'</b></td><td><span class="nameC"><span class="ava" style="background:'+avc[i%avc.length]+'">'+r[1][0]+'</span>'+r[1]+'</span></td>'+
      '<td>'+r[2]+'</td><td>'+r[3]+'</td><td>'+r[4]+'</td><td>'+r[5]+'원</td>'+
      '<td><span class="badge '+r[6]+'">'+r[7]+'</span></td></tr>';
  }).join('');
</script>
</body>
</html>
